name: Release Portable Bundles & Mods

on:
  push:
    tags:
      - "v*"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package example mods into ZIPs
        run: |
          mkdir -p dist-zips
          for dir in examples/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../dist-zips/${name}.zip" . -x "*.test.mjs")
          done
          ls -lh dist-zips/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-zips
          path: dist-zips/*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Qt6 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ qmake6 qt6-base-dev qt6-declarative-dev qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates

      - name: Build UI & install production Node deps
        run: |
          npm ci --omit=dev
          npm run build:ui

      - name: Stage portable Linux bundle
        run: |
          STAGE="trafficity-mod-manager-linux-x64"
          mkdir -p "$STAGE/bin" "$STAGE/examples"
          cp bin/trafficity-mod-manager "$STAGE/bin/"
          cp -r src runtime types docs node_modules "$STAGE/"
          cp package.json package-lock.json registry.json README.md MODDING.md GAME_BINDINGS.md launch-app.sh "$STAGE/"
          for dir in examples/*/; do
            name=$(basename "$dir")
            mkdir -p "$STAGE/examples/$name"
            (cd "$dir" && tar --exclude="*.test.mjs" -cf - .) | (cd "$STAGE/examples/$name" && tar -xf -)
          done
          chmod +x "$STAGE/launch-app.sh" "$STAGE/bin/trafficity-mod-manager"
          tar -czf trafficity-mod-manager-linux-x64.tar.gz "$STAGE"
          zip -r trafficity-mod-manager-linux-x64.zip "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            trafficity-mod-manager-linux-x64.tar.gz
            trafficity-mod-manager-linux-x64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6 (MSVC 2022)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.1"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          setup-python: "false"

      - name: Build Windows Qt6 Quick UI & bundle DLLs
        shell: pwsh
        run: |
          npm ci --omit=dev
          $qtBin = Join-Path $env:Qt6_DIR "bin"
          $qmake = Join-Path $qtBin "qmake.exe"
          $windeployqt = Join-Path $qtBin "windeployqt.exe"
          New-Item -ItemType Directory -Force -Path ui/build, bin | Out-Null
          Push-Location ui/build
          & $qmake ../trafficity-mod-manager.pro
          nmake
          Pop-Location
          $exe = Get-ChildItem -Path ui/build -Filter "trafficity-mod-manager.exe" -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "bin/trafficity-mod-manager.exe" -Force
          & $windeployqt --qmldir ui --no-translations bin/trafficity-mod-manager.exe

      - name: Stage portable Windows bundle
        shell: pwsh
        run: |
          $stage = "trafficity-mod-manager-windows-x64"
          New-Item -ItemType Directory -Force -Path "$stage\bin", "$stage\examples" | Out-Null
          Copy-Item bin\* "$stage\bin\" -Recurse -Force
          foreach ($d in @("src", "runtime", "types", "docs", "node_modules")) {
            Copy-Item $d "$stage\$d" -Recurse -Force
          }
          foreach ($f in @("package.json", "package-lock.json", "registry.json", "README.md", "MODDING.md", "GAME_BINDINGS.md", "launch-app.bat")) {
            Copy-Item $f "$stage\" -Force
          }
          Get-ChildItem examples -Directory | ForEach-Object {
            $dst = "$stage\examples\$($_.Name)"
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item "$($_.FullName)\*" $dst -Recurse -Force -Exclude "*.test.mjs"
          }
          Compress-Archive -Path $stage -DestinationPath "trafficity-mod-manager-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: trafficity-mod-manager-windows-x64.zip

  release:
    needs: [package-mods, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dist-zips/*.zip
            artifacts/linux-bundle/*
            artifacts/windows-bundle/*
            registry.json
          generate_release_notes: true
